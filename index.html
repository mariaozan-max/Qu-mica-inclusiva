<style>/* Química Inclusiva · tokens de color. Concepto: azul de laboratorio, superficies claras y mucho aire.
   Cada tema se activa con data-pref en <html>; sin elección, sigue el tema del sistema o del visor. */
:root {
  --bg: #f1f6fc;
  --surface: #ffffff;
  --surface-2: #e6eefa;
  --fg: #12263f;
  --muted: #425776;
  --accent: #1c58b8;
  --accent-fg: #ffffff;
  --accent-soft: #dce9fb;
  --border: #b4c7e2;
  --ok: #176b40;
  --ok-soft: #dff3e8;
  --err: #a8231c;
  --err-soft: #fbe4e2;
  --warn-soft: #fff1c7;
  --focus: #b45309;
  --font-display: 'Lexend', 'Atkinson Hyperlegible', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-pref]) {
    --bg: #0c1726; --surface: #13243a; --surface-2: #1b3150; --fg: #e8f0fb; --muted: #a8bcd7;
    --accent: #7db2ff; --accent-fg: #0c1726; --accent-soft: #1e3a62; --border: #38557d;
    --ok: #62d49c; --ok-soft: #14382a; --err: #ff9088; --err-soft: #46201f; --warn-soft: #43380f; --focus: #ffb454;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-pref]),
:root[data-pref="dark"] {
  --bg: #0c1726; --surface: #13243a; --surface-2: #1b3150; --fg: #e8f0fb; --muted: #a8bcd7;
  --accent: #7db2ff; --accent-fg: #0c1726; --accent-soft: #1e3a62; --border: #38557d;
  --ok: #62d49c; --ok-soft: #14382a; --err: #ff9088; --err-soft: #46201f; --warn-soft: #43380f; --focus: #ffb454;
  color-scheme: dark;
}
:root[data-pref="high"] {
  --bg: #000000; --surface: #000000; --surface-2: #0d0d0d; --fg: #ffffff; --muted: #ffffff;
  --accent: #ffd400; --accent-fg: #000000; --accent-soft: #1a1600; --border: #ffffff;
  --ok: #4dff9a; --ok-soft: #002a14; --err: #ff8080; --err-soft: #330000; --warn-soft: #2e2600; --focus: #00e5ff;
  color-scheme: dark;
}
:root[data-pref="cream"] {
  --bg: #faf1d6; --surface: #fffae8; --surface-2: #f1e5be; --fg: #2a2416; --muted: #55492f;
  --accent: #1a4d99; --accent-fg: #ffffff; --accent-soft: #e6e6d2; --border: #cdbb8a;
  --ok: #17603a; --ok-soft: #e0efd6; --err: #9c241c; --err-soft: #f6dcd0; --warn-soft: #f7e3a0; --focus: #9a3b00;
}
body { background: var(--bg); color: var(--fg); }

/* Ilustraciones: colores fijos para las figuras; el trazo, el vidrio y el fondo siguen al tema. */
:root {
  --c-blue: #2f7ad6; --c-teal: #14a39a; --c-orange: #f08a24; --c-yellow: #f7c948; --c-pink: #ec6a9a; --c-purple: #8b5cf6; --c-green: #3fb56b;
  --art-ink: #12263f; --art-glass: rgba(255, 255, 255, 0.75); --art-ground: #c9d8ee;
  --scene-bg: linear-gradient(180deg, #cfe5ff 0%, #eef6ff 100%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-pref]) { --art-ink: #e8f0fb; --art-glass: rgba(180, 210, 255, 0.28); --art-ground: #2a4468; --scene-bg: linear-gradient(180deg, #17365c 0%, #0f2038 100%); }
}
:root[data-theme="dark"]:not([data-pref]), :root[data-pref="dark"] { --art-ink: #e8f0fb; --art-glass: rgba(180, 210, 255, 0.28); --art-ground: #2a4468; --scene-bg: linear-gradient(180deg, #17365c 0%, #0f2038 100%); }
:root[data-pref="high"] { --art-ink: #ffffff; --art-glass: rgba(255, 255, 255, 0.2); --art-ground: #333333; --scene-bg: #000000; }
:root[data-pref="cream"] { --art-ink: #2a2416; --art-glass: rgba(255, 255, 255, 0.6); --art-ground: #e6d6a8; --scene-bg: linear-gradient(180deg, #f6e7b6 0%, #fff6d8 100%); }
</style>
<style>*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font-body); min-height: 100%; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.25; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 600; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 1rem; top: -4rem; background: var(--accent); color: var(--accent-fg); padding: 0.6rem 1rem; border-radius: 8px; z-index: 100; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 0.5rem); }
svg.ico { width: var(--icon); height: var(--icon); flex: none; }

/* ---------- Encabezado ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar-in { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 1rem; max-width: 1280px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--fg); min-width: 0; margin-right: auto; }
.brand b { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.15; }
.brand small { display: block; color: var(--muted); font-size: 0.78rem; }
.brand-txt { min-width: 0; }
.tools { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; border: 1px solid var(--border); border-radius: 999px; padding: 0.35rem 0.8rem; background: var(--surface-2); }
.profile-chip { display: inline-flex; align-items: center; gap: 0.5rem; }
.avatar { width: 2rem; height: 2rem; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; color: #fff; font-family: var(--font-display); flex: none; text-shadow: 0 1px 1px rgba(0,0,0,.35); }
.avatar.lg { width: 3.4rem; height: 3.4rem; font-size: 1.4rem; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 2.75rem; padding: 0.55rem 1.1rem; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 700; text-decoration: none; color: var(--fg); transition: background var(--dur), transform var(--dur); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.small { min-height: 2.25rem; padding: 0.3rem 0.8rem; font-size: 0.92rem; }
.btn.big { min-height: 3.4rem; padding: 0.8rem 1.4rem; font-size: 1.1rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.btn[aria-pressed="true"], .btn[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.iconbtn { min-width: 2.75rem; padding: 0.5rem; }

/* ---------- Estructura ---------- */
.shell { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); }
.side { display: none; }
main { min-width: 0; padding: 1.25rem 1rem calc(6.5rem + env(safe-area-inset-bottom, 0px)); outline: none; }
.view { display: flex; flex-direction: column; gap: 1.5rem; max-width: 980px; }
@media (min-width: 960px) {
  .shell { grid-template-columns: 15.5rem minmax(0, 1fr); }
  .side { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 4.2rem); align-self: start; padding: 1.25rem 0 1.25rem 1rem; }
  main { padding: 1.5rem 1.5rem 7rem 2rem; }
}
.side nav { display: flex; flex-direction: column; gap: 0.25rem; }
.side a, .side button.navlink { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.9rem; border-radius: 12px; text-decoration: none; color: var(--fg); font-weight: 700; border: 2px solid transparent; background: none; cursor: pointer; text-align: left; width: 100%; }
.side a:hover, .side button.navlink:hover { background: var(--surface-2); }
.side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--border); padding: 0.35rem 0.5rem calc(0.35rem + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.25rem; }
.bottomnav a, .bottomnav button { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; padding: 0.4rem 0.1rem; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: 0.74rem; font-weight: 700; border: 2px solid transparent; background: none; cursor: pointer; min-height: 3rem; }
.bottomnav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
@media (min-width: 960px) { .bottomnav { grid-template-columns: repeat(5, 8rem); justify-content: center; } .bottomnav .more { display: none; } }

/* ---------- Tarjetas y portada ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 1.25rem; min-width: 0; }
.card.pad-lg { padding: 1.6rem; }
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 1.6rem 1.4rem; color: #fff; background: linear-gradient(135deg, #123d86 0%, #1c58b8 60%, #2f7ad6 100%); display: grid; gap: 0.6rem; }
.hero h1, .hero p { color: #fff; position: relative; }
.hero .lead { font-size: 1.1rem; opacity: 0.95; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.4rem; position: relative; }
.hero .btn { border-color: #fff; }
.hero .btn.primary { background: #fff; color: #123d86; }
.hero .btn.primary:hover { background: #e9f1ff; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); }
.tile { display: grid; gap: 0.6rem; align-content: start; text-decoration: none; color: inherit; transition: border-color var(--dur), transform var(--dur); }
a.tile:hover { border-color: var(--accent); transform: translateY(-2px); }
.tile .tag { width: 3rem; height: 3rem; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tile p { color: var(--muted); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.muted { color: var(--muted); }
.row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 0.9rem; }
.badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.65rem; border-radius: 999px; font-size: 0.82rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.badge.soon { background: var(--surface-2); color: var(--muted); border-color: var(--border); }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.progress { height: 0.8rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s; }
.pbar { display: grid; gap: 0.35rem; }
.pbar-top { display: flex; justify-content: space-between; gap: 1rem; font-weight: 700; font-size: 0.92rem; }
.modnum { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
.crumbs { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

/* ---------- Módulo ---------- */
.stepper { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 0.5rem; list-style: none; padding: 0; margin: 0; }
.stepper button { width: 100%; display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.8rem; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 700; text-align: left; min-height: 3rem; }
.stepper button[aria-current="step"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.stepper .dot { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; flex: none; font-size: 0.8rem; }
.stepper .done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.stepper .na button { opacity: 0.7; }
.seg { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; justify-content: center; min-height: 2.6rem; padding: 0.4rem 1rem; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 700; cursor: pointer; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.blocknav { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.blocknav button { min-width: 2.6rem; min-height: 2.6rem; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; cursor: pointer; }
.blocknav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.blocknav button.seen:not([aria-current="true"]) { border-color: var(--ok); color: var(--ok); }
.concept { display: grid; gap: 1rem; }
.concept .def { font-size: 1.2rem; line-height: 1.5; }
.example { border-left: 4px solid var(--accent); background: var(--surface-2); padding: 0.8rem 1rem; border-radius: 0 12px 12px 0; }
.example b, .nota b { display: block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.15rem; }
.formula { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 14px; padding: 0.6rem 1.2rem; justify-self: start; }
.versus { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.versus > div { border: 2px solid var(--border); border-radius: 16px; padding: 1rem; display: grid; gap: 0.5rem; align-content: start; background: var(--surface); }
.versus h4 { font-size: 1.25rem; color: var(--accent); }
.versus small { color: var(--muted); font-size: 0.95rem; }
.mapa { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 0.6rem; list-style: none; padding: 0; margin: 0; }
.mapa li { border: 2px solid var(--border); border-radius: 14px; padding: 0.7rem 0.9rem; background: var(--surface); }
.mapa b { display: block; color: var(--accent); }
.nota { background: var(--warn-soft); border-radius: 12px; padding: 0.8rem 1rem; }
.steps-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.6rem; counter-reset: s; }
.steps-list li { counter-increment: s; display: grid; grid-template-columns: 2.2rem 1fr; gap: 0.75rem; align-items: start; font-size: 1.1rem; }
.steps-list li::before { content: counter(s); width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-family: var(--font-display); }
.audio-text { font-size: 1.1rem; display: grid; gap: 0.8rem; }
.term { background: none; border: 0; border-bottom: 2px dotted var(--accent); color: var(--accent); font: inherit; font-weight: 700; padding: 0; cursor: help; letter-spacing: inherit; }
.how-to { border: 2px dashed var(--border); border-radius: 12px; padding: 0.7rem 1rem; }
.how-to ol { margin: 0.3rem 0 0; padding-left: 1.3rem; }
.video-box { aspect-ratio: 16/9; max-width: 100%; border-radius: 16px; border: 2px dashed var(--border); display: grid; place-items: center; text-align: center; padding: 1rem; background: var(--surface-2); }
.pager { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }

/* ---------- Simulación ---------- */
.sim { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); align-items: start; }
.sim-stage { border-radius: 16px; border: 2px solid var(--border); background: var(--surface-2); padding: 1rem; display: grid; gap: 0.6rem; justify-items: center; }
.sim-stage svg { width: 100%; max-width: 18rem; height: auto; }
.readout { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; width: 100%; }
.readout div { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.8rem; }
.readout b { display: block; font-size: 1.5rem; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 2rem; }

/* ---------- Ejercicios ---------- */
.q { display: grid; gap: 0.8rem; }
.opts { display: grid; gap: 0.5rem; }
.opt { display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.75rem 0.9rem; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; background: var(--surface); }
.opt:hover { background: var(--surface-2); }
.opt input { margin-top: 0.25rem; accent-color: var(--accent); width: 1.15rem; height: 1.15rem; flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--err); background: var(--err-soft); }
.feedback { border-radius: 12px; padding: 0.7rem 1rem; font-weight: 700; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.no { background: var(--err-soft); color: var(--err); }
.feedback p { font-weight: 400; color: var(--fg); margin-top: 0.2rem; }
.bank { display: flex; flex-wrap: wrap; gap: 0.5rem; min-height: 3rem; padding: 0.6rem; border: 2px dashed var(--border); border-radius: 14px; }
.chipbtn { padding: 0.45rem 0.9rem; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; cursor: pointer; min-height: 2.5rem; }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chipbtn.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.chipbtn.wrong { border-color: var(--err); background: var(--err-soft); color: var(--err); }
.buckets { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
.bucket { border: 2px solid var(--border); border-radius: 14px; padding: 0.7rem; display: grid; gap: 0.5rem; align-content: start; min-height: 6rem; }
.bucket > button.drop { text-align: left; background: var(--accent-soft); border: 0; border-radius: 10px; padding: 0.5rem 0.7rem; font-weight: 700; color: var(--accent); cursor: pointer; min-height: 2.5rem; }
.bucket .in { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.pairs { display: grid; gap: 0.6rem; }
.pair { display: grid; gap: 0.4rem; grid-template-columns: minmax(0, 1fr); }
.pair select, input[type="text"], input[type="search"], textarea, select { width: 100%; min-height: 2.75rem; padding: 0.5rem 0.75rem; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); }
@media (min-width: 640px) { .pair { grid-template-columns: 10rem minmax(0, 1fr); align-items: center; } }
.scorebar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
.bigscore { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; color: var(--accent); }

/* ---------- Crucigrama ---------- */
.cw-wrap { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .cw-wrap { grid-template-columns: auto minmax(16rem, 1fr); align-items: start; } }
.cw-scroll { overflow-x: auto; padding: 0.4rem; max-width: 100%; }
.cw { display: grid; gap: 2px; width: max-content; background: transparent; --cell: clamp(2.2rem, 9vw, 2.9rem); }
.cw-cell { position: relative; width: var(--cell); height: var(--cell); }
.cw-cell.void { visibility: hidden; }
.cw-cell input { width: 100%; height: 100%; padding: 0; text-align: center; text-transform: uppercase; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; border: 2px solid var(--fg); border-radius: 6px; background: var(--surface); caret-color: var(--accent); }
.cw-cell input.hl { background: var(--accent-soft); }
.cw-cell input.cur { background: var(--accent); color: var(--accent-fg); }
.cw-cell input.bad { background: var(--err-soft); border-color: var(--err); color: var(--err); }
.cw-cell input.good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cw-cell input.hint { color: var(--accent); }
.cw-cell .n { position: absolute; top: 1px; left: 3px; font-size: 0.62rem; font-weight: 700; pointer-events: none; color: var(--muted); font-family: var(--font-body); }
.cw-cell input.cur ~ .n { color: var(--accent-fg); }
.clues { display: grid; gap: 0.8rem; }
.clues ol { list-style: none; padding: 0; margin: 0.4rem 0 0; display: grid; gap: 0.3rem; }
.clues li button { text-align: left; width: 100%; background: none; border: 2px solid transparent; border-radius: 10px; padding: 0.45rem 0.6rem; cursor: pointer; display: grid; grid-template-columns: 2rem 1fr; gap: 0.3rem; }
.clues li button:hover { background: var(--surface-2); }
.clues li button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.clues li.solved button { color: var(--ok); }
.clues li.solved button span:last-child { text-decoration: line-through; text-decoration-thickness: 1px; }
.wordbank { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.wordbank span { padding: 0.2rem 0.7rem; border: 1px solid var(--border); border-radius: 999px; font-weight: 700; font-size: 0.9rem; background: var(--surface-2); }
.wordbank span.used { opacity: 0.45; text-decoration: line-through; }

/* ---------- Logros ---------- */
.stats { display: grid; gap: 0.8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; font-variant-numeric: tabular-nums; color: var(--accent); }
.medal { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0.8rem; align-items: center; }
.medal .disc { width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px dashed var(--border); color: var(--muted); }
.medal.got .disc { background: var(--accent); border: 2px solid var(--accent); color: var(--accent-fg); }
.medal.locked h3 { color: var(--muted); }

/* ---------- Diálogos, avisos, panel ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 12, 24, 0.6); z-index: 60; display: grid; place-items: center; padding: 1rem; }
.scrim[hidden] { display: none; }
.dialog { background: var(--surface); color: var(--fg); border: 2px solid var(--border); border-radius: 18px; padding: 1.4rem; width: min(100%, 32rem); max-height: 90vh; overflow: auto; display: grid; gap: 0.9rem; }
.dialog .close { justify-self: end; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 70; width: min(100%, 27rem); background: var(--surface); border-left: 2px solid var(--border); display: grid; grid-template-rows: auto 1fr auto; transform: translateX(0); transition: transform var(--dur); padding-top: env(safe-area-inset-top, 0px); }
.panel[hidden] { display: none; }
.panel header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.9rem 1rem; border-bottom: 1px solid var(--border); }
.panel .body { overflow-y: auto; padding: 0.6rem 1rem 1.5rem; display: grid; gap: 0.7rem; align-content: start; }
.panel footer { padding: 0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); display: flex; gap: 0.6rem; flex-wrap: wrap; }
.panel details { border: 2px solid var(--border); border-radius: 14px; background: var(--surface); }
.panel summary { padding: 0.8rem 1rem; font-family: var(--font-display); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; list-style: none; min-height: 3rem; }
.panel summary::-webkit-details-marker { display: none; }
.panel summary::after { content: '+'; margin-left: auto; font-size: 1.4rem; }
.panel details[open] summary::after { content: '−'; }
.panel .opt-group { padding: 0 1rem 1rem; display: grid; gap: 1rem; }
.field { display: grid; gap: 0.4rem; }
.field > .lbl { font-weight: 700; }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 2.75rem; cursor: pointer; font-weight: 700; }
.switch input { appearance: none; width: 3.1rem; height: 1.8rem; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--border); position: relative; flex: none; cursor: pointer; transition: background var(--dur); }
.switch input::after { content: ''; position: absolute; top: 0.15rem; left: 0.18rem; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--muted); transition: transform var(--dur); }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(1.25rem); background: var(--accent-fg); }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.colors input[type="color"] { width: 100%; min-height: 2.75rem; padding: 0.15rem; }
.toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); display: grid; gap: 0.5rem; width: min(calc(100% - 2rem), 26rem); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 0.8rem 1rem; border-radius: 12px; font-weight: 700; box-shadow: 0 6px 20px rgba(0, 0, 0, .3); animation: pop 0.25s; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

<style>/* Juegos: quiz, memoria, clasificar, fórmulas, balancear y calcular */
.q { border: 1px solid var(--border); border-radius: 14px; margin: 0; }
.q legend { font-weight: 700; padding: 0 0.4rem; font-size: 1.1rem; }
.opt { position: relative; display: flex; gap: 0.7rem; align-items: center; padding: 0.7rem 0.9rem; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; min-height: 3rem; }
.opt input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); flex: none; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt.off { opacity: 0.45; text-decoration: line-through; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--err); background: var(--err-soft); }
.opt.right::after { content: '✓ correcta'; margin-left: auto; font-weight: 700; color: var(--ok); }
.opt.wrong::after { content: '✗ tu respuesta'; margin-left: auto; font-weight: 700; color: var(--err); }

.mem-grid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 0.6rem; }
@media (max-width: 520px) { .mem-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mem { min-height: 5.2rem; padding: 0.5rem; border-radius: 14px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; cursor: pointer; display: grid; place-items: center; text-align: center; overflow-wrap: anywhere; }
.mem[data-state="up"] { background: var(--surface); color: var(--fg); }

.mem-face { font-size: 1rem; }

.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; min-height: 2.6rem; }

": 0, "c": 0, "dir": "h", "n": 1, "clue": "Unidad de fuerza: la que da a una masa de 1 kg una aceleración de 1 m/s²."}, {"answer": "EINSTEIN", "r": 0, "c": 1, "dir": "v", "n": 2, "clue": "Científico que mostró que materia y energía son manifestaciones de una misma entidad: E = m·c²."}, {"answer": "CINETICA", "r": 0, "c": 8, "dir": "v", "n": 3, "clue": "Energía que depende de la masa y de la velocidad de un cuerpo (½·m·v²)."}, {"answer": "POTENCIAL", "r": 1, "c": 10, "dir": "v", "n": 4, "clue": "Energía almacenada por un cuerpo debido a su altura o a fuerzas de atracción o repulsión."}, {"answer": "ENERGIA", "r": 2, "c": 0, "dir": "h", "n": 5, "clue": "Según la ley de conservación, no se crea ni se destruye: solo se transforma."}, {"answer": "ERGIO", "r": 4, "c": 3, "dir": "v", "n": 6, "clue": "Unidad de energía más pequeña que el joule: 1 x 10⁻⁷ joule."}, {"answer": "CALOR", "r": 4, "c": 6, "dir": "v", "n": 7, "clue": "Forma de energía en la que terminan transformándose todas las demás; los químicos casi siempre miden la energía así."}, {"answer": "DEGRADACION", "r": 5, "c": 0, "dir": "h", "n": 8, "clue": "Pérdida de calidad de la energía: generalmente se transforma en calor que se irradia al espacio."}, {"answer": "JOULE", "r": 9, "c": 7, "dir": "h", "n": 9, "clue": "Unidad de energía en el Sistema Internacional."}]}, "quiz": [{"q": "La energía cinética de un cuerpo depende de…", "ok": "Su masa y su velocidad", "mal": ["Solo su color", "Su punto de ebullición", "Solo su altura"], "expl": "La energía cinética es ½ · m · v²."}, {"q": "Si un cuerpo se eleva a mayor altura, su energía potencial…", "ok": "Aumenta", "mal": ["Disminuye", "No cambia", "Se vuelve cero"], "expl": "Elevar un cuerpo exige trabajo, y ese trabajo queda almacenado como energía potencial (Ep = Fg · h)."}, {"q": "Un cuerpo está por ser soltado desde cierta altura. ¿Qué energía tiene?", "ok": "Potencial máxima y cinética cero", "mal": ["Cinética máxima y potencial cero", "Las dos son cero", "Las dos son máximas"], "expl": "Antes de caer: Ep con valor máximo y Ec con valor cero."}, {"q": "Un cuerpo en caída llega al suelo. ¿Cómo están sus energías?", "ok": "Ep mínima y Ec máxima", "mal": ["Ep máxima y Ec cero", "Ep y Ec máximas", "Ep y Ec mínimas"], "expl": "Al llegar al suelo la altura es nula y la energía cinética es máxima."}, {"q": "¿Qué dice la ley de conservación de la energía?", "ok": "La energía no se crea ni se destruye, solo se transforma", "mal": ["La energía se destruye al usarse", "La energía solo se crea en las reacciones", "La energía siempre aumenta"], "expl": "En un sistema aislado, la energía total es constante."}, {"q": "¿Cuál es la unidad de energía en el Sistema Internacional?", "ok": "El joule", "mal": ["El newton", "El kilogramo", "El metro"], "expl": "El newton es una unidad de fuerza."}, {"q": "¿Qué expresa E = m · c²?", "ok": "Que materia y energía son manifestaciones de una misma entidad y pueden convertirse", "mal": ["Que la energía siempre se destruye", "Que la masa es una fuerza", "Que la luz no tiene energía"], "expl": "c es la velocidad de la luz en el vacío."}, {"q": "¿Qué significa la degradación de la energía?", "ok": "Que se transforma generalmente en calor que se irradia al espacio", "mal": ["Que desaparece", "Que se crea energía nueva", "Que se vuelve materia"], "expl": "La energía no se destruye, pero se degrada."}], "memoria": [["Energía cinética", "Depende de masa y velocidad"], ["Energía potencial", "Depende de la altura"], ["Joule", "Unidad de energía (SI)"], ["Newton", "Unidad de fuerza"], ["Ergio", "10⁻⁷ joule"], ["E = m · c²", "Einstein"], ["Calor", "Donde terminan todas las energías"], ["Conservación", "No se crea ni se destruye"]]}, "3": {"crucigrama": {"rows": 15, "cols": 9, "words": [{"answer": "SOLUCION", "r": 0, "c": 8, "dir": "v", "n": 1, "clue": "Sistema homogéneo de dos o más componentes que puede fraccionarse por destilación o cristalización."}, {"answer": "FASE", "r": 1, "c": 0, "dir": "v", "n": 2, "clue": "Cada sistema homogéneo, con superficie de separación bien definida, en que se divide un sistema heterogéneo."}, {"answer": "HETEROGENEO", "r": 1, "c": 3, "dir": "v", "n": 3, "clue": "Sistema con distintas propiedades intensivas en por lo menos dos de sus puntos."}, {"answer": "SISTEMA", "r": 3, "c": 0, "dir": "h", "n": 4, "clue": "Porción limitada del universo que se separa, real o imaginariamente, para su estudio."}, {"answer": "HOMOGENEO", "r": 6, "c": 0, "dir": "h", "n": 5, "clue": "Sistema con las mismas propiedades intensivas en todos sus puntos."}, {"answer": "ABIERTO", "r": 8, "c": 0, "dir": "v", "n": 6, "clue": "Sistema que intercambia masa y energía con el medio."}, {"answer": "MEZCLA", "r": 8, "c": 2, "dir": "h", "n": 7, "clue": "Sistema de dos o más componentes que conservan sus propiedades; las del sistema varían según la cantidad de cada uno."}, {"answer": "AISLADO", "r": 8, "c": 7, "dir": "v", "n": 8, "clue": "Sistema que no intercambia ni masa ni energía con el medio, como un termo tapado."}, {"answer": "INTERFASE", "r": 10, "c": 0, "dir": "h", "n": 9, "clue": "Superficie de separación entre dos fases."}, {"answer": "CERRADO", "r": 13, "c": 2, "dir": "h", "n": 10, "clue": "Sistema que solo intercambia energía con el medio."}]}, "quiz": [{"q": "¿Qué es un sistema material?", "ok": "Una porción limitada del universo que se separa para su estudio", "mal": ["Todo el universo", "Solo una mezcla de líquidos", "Una sustancia pura"], "expl": "El sistema puede separarse real o imaginariamente."}, {"q": "Un termo tapado, de doble pared de vidrio, es un sistema…", "ok": "Aislado", "mal": ["Abierto", "Cerrado", "Homogéneo"], "expl": "No pasa masa ni energía entre el sistema y el medio."}, {"q": "Agua que se calienta dentro de un erlenmeyer tapado: es un sistema…", "ok": "Cerrado", "mal": ["Abierto", "Aislado", "Heterogéneo"], "expl": "Hay transferencia de calor, pero el vapor no puede escapar: no pasa masa."}, {"q": "Agua que se calienta en un vaso destapado, ", "cats": ["Abierto", "Cerrado", "Aislado"], "items": [["Agua que hierve en un vaso destapado", 0], ["Agua que se calienta en un erlenmeyer tapado", 1], ["Agua en un termo tapado", 2], ["Un sistema que intercambia masa y energía", 0], ["Un sistema que solo intercambia energía", 1], ["Un sistema que no intercambia masa ni energía", 2]]}]}, "4": {"crucigrama": {"rows": 12, "cols": 11, "words": [{"answer": "SOLUTO", "r": 0, "c": 1, "dir": "h", "n": 1, "clue": "Fase dispersa de una solución verdadera."}, {"answer": "TYNDALL", "r": 0, "c": 5, "dir": "v", "n": 2, "clue": "Efecto que deja ver el recorrido de un haz de luz dentro de un coloide."}, {"answer": "SUSPENSION", "r": 0, "c": 9, "dir": "v", "n": 3, "clue": "Dispersión de partículas grandes que acaban sedimentando, como arena agitada con agua."}, {"answer": "MICRON", "r": 1, "c": 0, "dir": "v", "n": 4, "clue": "Milésima parte del milímetro (0,001 mm). Sirve para medir el tamaño de las partículas."}, {"answer": "COLOIDE", "r": 3, "c": 0, "dir": "h", "n": 5, "clue": "Dispersión cuyas partículas no sedimentan y se ven solo con ultramicroscopio. La gelatina es un ejemplo."}, {"answer": "DIFUSION", "r": 4, "c": 7, "dir": "v", "n": 6, "clue": "Fenómeno por el cual una sustancia se reparte hasta quedar uniforme, sin fuerzas externas."}, {"answer": "EMULSION", "r": 5, "c": 2, "dir": "h", "n": 7, "clue": "Dispersión fina de un líquido en otro, como aceite y agua agitados."}, {"answer": "DISPERSION", "r": 8, "c": 1, "dir": "h", "n": 8, "clue": "Difusión de una sustancia en el seno de otra."}, {"answer": "SOLVENTE", "r": 11, "c": 2, "dir": "h", "n": 9, "clue": "Fase dispersante de una solución. También se llama disolvente."}]}, "quiz": [{"q": "¿Qué es una dispersión?", "ok": "La difusión de una sustancia en el seno de otra", "mal": ["Una sustancia pura", "Un cambio de estado", "Un tipo de átomo"], "expl": "Tiene dos partes: la fase dispersa y la fase dispersante."}, {"q": "¿Cuál de estas dispersiones tiene las partículas más q": "En N₂ + 3 H₂ → 2 NH₃, ¿cuántos moles de H₂ se necesitan para formar 6 moles de NH₃?", "a": 9, "u": "mol", "tol": 0, "pista": "3 mol de H₂ producen 2 mol de NH₃.", "res": "6 · 3 / 2 = 9 mol", "nivel": 1}, {"q": "¿Cuántos gramos de N₂ reaccionan con 6 g de H₂? (N₂ = 28 g/mol, H₂ = 2 g/mol)", "a": 28, "u": "g", "tol": 0, "pista": "3 mol de H₂ pesan 6 g y reaccionan con 1 mol de N₂.", "res": "1 mol de N₂ = 28 g", "nivel": 2}, {"q": "¿Cuántos moles son 34 g de NH₃? (NH₃ = 17 g/mol)", "a": 2, "u": "mol", "tol": 0, "pista": "Dividí la masa por 17.", "res": "34 / 17 = 2 mol", "nivel": 2}, {"q": "¿Cuántos gramos pesan 4 moles de NH₃? (NH₃ = 17 g/mol)", "a": 68, "u": "g", "tol": 0, "pista": "Multiplicá los moles por 17.", "res": "4 · 17 = 68 g", "nivel": 2}, {"q": "¿Cuántos gramos de NH₃ se obtienen a partir de 20 g de H₂? (H₂ = 2, NH₃ = 17 g/mol)", "a": 113.3, "u": "g", "tol": 0.01, "pista": "6 g de H₂ producen 34 g de NH₃: usá una regla de tres.", "res": "20 · 34 / 6 ≈ 113,3 g", "nivel": 3}, {"q": "¿Cuántas moléculas hay en 2 moles de NH₃? Respondé en unidades de 10²³ moléculas.", "a": 12.05, "u": "· 10²³ moléculas", "tol": 0.01, "pista": "Multiplicá 2 por 6,023.", "res": "2 · 6,023 = 12,05", "nivel": 3}]}}, "modulo-01": {"id": 1, "titulo": "El Mundo de la Química", "fuente": "Adaptado del Módulo de Química 2023, Universidad Nacional de San Luis (Dr. Miguel Ángel Zamora y Dr. José Antonio Salonia), páginas 1 a 7.", "bloques": [{"id": "quimica", "titulo": "¿Qué es la química?", "visual": {"termino": "Química", "definicion": "Rama de las ciencias naturales que estudia la {{materia|materia}}, sus propiedades, su estructura, sus transformaciones y las leyes que rigen esas transformaciones.", "ejemplo": "El agua puede convertirse en dos gases: hidrógeno y oxígeno. Los químicos estudian qué es el agua y por qué y cómo se transforma.", "mapa": [["Orgánica", "Compuestos del carbono"], ["Inorgánica", "Todos los elementos y sus compuestos"], ["Físico-química", "Equilibrio, energía y estructura de las moléculas"], ["Analítica", "Métodos para saber qué hay en una muestra y cuánto"]]}, "pasos": ["La química estudia la materia.", "También estudia sus propiedades, su estructura y sus transformaciones.", "Ejemplo: el agua se puede transformar en hidrógeno y oxígeno.", "La química se divide en ramas: orgánica, inorgánica, físico-química y analítica.", "Una muestra se puede analizar de forma cualitativa (qué componentes tiene) o cuantitativa (cuánto hay de cada uno)."], "texto": "La química es una rama de las ciencias naturales que estudia la materia, sus propiedades, su estructura, sus transformaciones y las leyes que rigen esas transformaciones. Por ejemplo, el agua puede convertirse en dos gases, hidrógeno y oxígeno. Los químicos estudian qué es el agua, por qué y cómo puede convertirse en esos gases. La química tiene cuatro divisiones básicas. La química orgánica estudia sobre todo los compuestos del carbono. La química inorgánica trata todos los elementos y sus compuestos. La físico-química estudia el equilibrio y la termodinámica de las reacciones, la energía asociada y la estructura de las moléculas. La química analítica desarrolla métodos para determinar la composición de las sustancias y sus mezclas."}, {"id": "materia", "titulo": "Materia", "visual": {"termino": "Materia", "definicion": "Todo aquello que tiene <mark class=\"key\">masa<\/mark> e <mark class=\"key\">inercia<\/mark> y ocupa un lugar en el espacio.", "ejemplo": "Es materia el aire que respiramos, el agua que bebemos y el vidrio de un vaso."}, "pasos": ["Materia es todo lo que tiene masa e inercia.", "Además, ocupa un lugar en el espacio.", "Todo lo que cumple estas condiciones es material.", "Ejemplos: el aire, el agua, el vidrio de un vaso."], "texto": "La química estudia la materia. Materia es todo aquello que tiene masa e inercia y ocupa un lugar en el espacio. Por lo tanto, todo lo que cumpla con estas condiciones es considerado material. Es materia el aire que respiramos, el agua que bebemos y el vidrio que forma un vaso."}, {"id": "masa", "titulo": "Masa", "visual": {"termino": "Masa", "definicion": "<mark class=\"key\">Cantidad de materia<\/mark> contenida en un objeto. Es invariable.", "ejemplo": "Se mide pesando el objeto y se expresa en kilogramos o gramos. No hay que confundirla con el tamaño, que es la capacidad para ocupar espacio."}, "pasos": ["La masa es la cantidad de materia de un objeto.", "No cambia: es invariable.", "Se mide pesando el objeto.", "Sus unidades son el kilogramo y el gramo.", "No es lo mismo que el tamaño."], "texto": "La masa es la cantidad de materia contenida en un objeto y es invariable. La masa de un objeto se mide pesándolo, y se expresa en kilogramo o gramo. No hay que confundir la masa con el tamaño, que es la capacidad para ocupar espacio."}, {"id": "peso", "titulo": "Peso", "visual": {"termino": "Peso", "definicion": "<mark class=\"key\">Fuerza<\/mark> con que un objeto es atraído por la Tierra. Su valor cambia según el lugar.", "ejemplo": "Un astronauta que pesa 78 kgr en la Tierra pesa solo 13 kgr en la Luna, donde la atracción es 1/6 de la terrestre. En el espacio exterior, donde la gravedad es cero, no tiene peso. Su masa no cambió.", "formula": "P = m · g"}, "pasos": ["El peso es la fuerza con que la Tierra atrae a un objeto.", "Se calcula con P = m · g (peso = masa por gravedad).", "La gravedad cambia según el lugar, así que el peso también cambia.", "La masa no depende del lugar. El peso sí.", "Ejemplo: 78 kgr en la Tierra son 13 kgr en la Luna y 0 en el espacio exterior."], "texto": "El peso es la fuerza con que un objeto es atraído por la Tierra. Se calcula como peso igual a masa por gravedad. Un astronauta que pesa 78 kilogramos peso en la Tierra, solo pesa 13 en la Luna, porque la atracción de la gravedad de la Luna es un sexto de la terrestre. En el espacio exterior, donde la gravedad es cero, no tiene peso. Por eso la masa es una propiedad que no depende del lugar donde se determine, pero el peso sí."}, {"id": "inercia", "titulo": "Inercia", "visual": {"termino": "Inercia", "definicion": "Propiedad por la cual un objeto tiende a <mark class=\"key\">seguir en el estado en que se encuentra<\/mark> mientras no actúe sobre él una fuerza.", "ejemplo": "Al arrancar un coche con violencia, los pasajeros son proyectados hacia atrás. Si tirás de un papel con una moneda encima, la moneda queda en el mismo lugar."}, "pasos": ["Un objeto en reposo sigue en reposo si nadie lo empuja.", "Un objeto que se mueve en línea recta y parejo sigue así si nadie lo frena.", "Eso es la inercia: resistencia a cambiar de estado.", "Ejemplo: al arrancar un coche, los pasajeros van hacia atrás.", "Ejemplo: la moneda sobre un papel no sigue al papel si se lo tira rápido."], "texto": "La inercia es la propiedad por la cual un objeto tiende a seguir en el estado en que se encuentra mientras no actúe sobre él una fuerza. Dicho de otro modo, es la resistencia que un objeto ofrece a cualquier cambio en su estado de reposo o movimiento rectilíneo y uniforme. Al arrancar un coche con violencia, los pasajeros son proyectados hacia atrás. Si se coloca una moneda sobre un papel y se tira de éste bruscamente, la moneda queda en el mismo lugar."}, {"id": "cuerpo", "titulo": "Cuerpo y sustancia", "visual": {"termino": "Cuerpo y sustancia", "comparar": [["Cuerpo", "Porción limitada de {{materia|materia}}. Tiene límites reales y peso.", "Un lápiz, un litro de agua, un balón de aire."], ["Sustancia", "Clase especial de materia. En las mismas condiciones siempre muestra las mismas propiedades.", "El agua, el hierro, el azúcar común."]]}, "pasos": ["Un cuerpo es una porción limitada de materia.", "Ejemplos de cuerpo: un lápiz, un litro de agua, un balón de aire.", "Una sustancia es una clase especial de materia.", "Una sustancia muestra siempre las mismas propiedades en las mismas condiciones.", "Ejemplos de sustancia: el agua y el hierro."], "texto": "Un cuerpo es una porción limitada de materia. Todo cuerpo tiene límites reales y peso. Son cuerpos un lápiz, un litro de agua, un balón de aire. Una sustancia es una clase especial de materia. Una sustancia determinada presenta siempre las mismas propiedades físicas y químicas bajo idénticas condiciones de observación. Son sustancias el agua y el hierro."}, {"id": "propiedades", "titulo": "Propiedades físicas y químicas", "visual": {"termino": "Propiedades", "definicion": "Una propiedad es simplemente alguna descripción de algún tipo. Se clasifican de dos maneras. La primera es según cambien o no la composición de la sustancia.", "comparar": [["Física", "Respuesta a un estímulo que <mark class=\"key\">no cambia la composición<\/mark> de la sustancia.", "Masa, densidad, estado de agregación, forma cristalina, punto de fusión."], ["Química", "Respuesta a un estímulo que <mark class=\"key\">cambia la composición<\/mark> de la sustancia.", "El hierro en un ácido deja de ser hierro. La electricidad separa el agua en oxígeno e hidrógeno (electrólisis)."]]}, "pasos": ["Una propiedad es una descripción de la materia.", "Propiedad física: la sustancia responde y su composición NO cambia.", "Ejemplos: masa, densidad, punto de fusión.", "Propiedad química: la sustancia responde y su composición SÍ cambia.", "Ejemplo: el hierro en ácido clorhídrico deja de ser hierro.", "Una sola propiedad no alcanza para reconocer una sustancia."], "texto": "Una propiedad de la materia es simplemente alguna descripción de algún tipo. Las propiedades físicas son las que se manifiestan como respuestas a estímulos que no cambian la composición de la sustancia. Entre ellas se incluyen la masa, la densidad, el estado de agregación, la forma cristalina y el punto de fusión. Las propiedades químicas son las que se manifiestan como respuestas a estímulos que cambian la composición de la sustancia. Se asocian a las reacciones químicas. Por ejemplo, si un trozo de hierro se introduce en ácido clorhídrico, el hierro deja de ser hierro. Ninguna propiedad sencilla sirve por sí sola para reconocer una sustancia."}, {"id": "intensivas", "titulo": "Propiedades extensivas e intensivas", "visual": {"termino": "Extensivas e intensivas", "definicion": "La segunda clasificación depende de si la propiedad cambia con la cantidad de materia.", "comparar": [["Extensiva", "<mark class=\"key\">Depende<\/mark> de la cantidad de materia. También se llama general.", "Peso, masa, volumen. 10 litros de agua pesan más que 1 litro."], ["Intensiva", "<mark class=\"key\">No depende<\/mark> de la cantidad de materia. También se llama específica. Permite identificar una sustancia.", "Densidad, punto de fusión, punto de ebullición, conductividad, índice de refracción."]], "nota": "La densidad del aluminio es 2,698 g/cm³ a 20 °C, sin importar cuánto aluminio haya. El agua hierve a 100 °C solo cuando la presión exterior es de 1 atmósfera."}, "pasos": ["Propiedad extensiva: depende de la cantidad de materia.", "Ejemplos: peso, masa y volumen.", "Propiedad intensiva: no depende de la cantidad de materia.", "Ejemplos: densidad, punto de fusión, punto de ebullición.", "Las intensivas dependen de las condiciones externas, como la presión o la temperatura.", "Por eso el agua hierve a 100 °C a 1 atmósfera de presión.", "Las propiedades intensivas permiten identificar una sustancia."], "texto": "Las propiedades extensivas o generales son aquellas que dependen de la cantidad de materia. Por ejemplo el peso, la masa y el volumen. Las propiedades intensivas o específicas son aquellas que no dependen de la cantidad de materia considerada. Por ejemplo la densidad, los puntos de ebullición y de fusión, la conductividad térmica y eléctrica, el índice de refracción y la forma cristalina. La densidad del aluminio es dos coma seis nueve ocho gramos por centímetro cúbico a veinte grados, sin importar la cantidad de aluminio. Las propiedades intensivas dependen de las condiciones externas. Por eso no es correcto decir que el agua hierve a cien grados: hierve a cien grados cuando la presión exterior es de una atmósfera. Las propiedades intensivas permiten identificar una sustancia."}]}, "crucigrama-01": {"rows": 16, "cols": 7, "words": [{"answer": "INERCIA", "r": 0, "c": 0, "dir": "h", "n": 1, "clue": "Propiedad por la cual un objeto sigue en reposo o en movimiento mientras no actúe una fuerza sobre él."}, {"answer": "EXTENSIVA", "r": 0, "c": 2, "dir": "v", "n": 2, "clue": "Tipo de propiedad que depende de la cantidad de materia, como el volumen."}, {"answer": "MATERIA", "r": 2, "c": 0, "dir": "h", "n": 3, "clue": "Todo aquello que tiene masa e inercia y ocupa un lugar en el espacio."}, {"answer": "SUSTANCIA", "r": 4, "c": 4, "dir": "v", "n": 4, "clue": "Clase especial de materia que presenta siempre las mismas propiedades, como el agua o el hierro."}, {"answer": "DENSIDAD", "r": 5, "c": 6, "dir": "v", "n": 5, "clue": "Masa de una sustancia por unidad de volumen. Es una propiedad intensiva."}, {"answer": "MASA", "r": 8, "c": 1, "dir": "h", "n": 6, "clue": "Cantidad de materia contenida en un objeto. No cambia según el lugar."}, {"answer": "CUERPO", "r": 10, "c": 1, "dir": "v", "n": 7, "clue": "Porción limitada de materia, por ejemplo un lápiz o un litro de agua."}, {"answer": "QUIMICA", "r": 11, "c": 0, "dir": "h", "n": 8, "clue": "Rama de las ciencias naturales que estudia la materia, sus propiedades, estructura y transformaciones."}, {"answer": "PESO", "r": 14, "c": 1, "dir": "h", "n": 9, "clue": "Fuerza con que la Tierra atrae a un objeto. Cambia según el lugar."}], "modulo": 1}};</script><script>/* Utilidades compartidas: creación de elementos, íconos, texto y avisos. */

    medal: '<circle cx="12" cy="9" r="5"/><path d="M8.5 13.5l-2 7.5 5.5-3 5.5 3-2-7.5"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
    scale: '<path d="M12 4v16M6 20h12M5 8h14M5 8l-3 7a3.5 3.5 0 0 0 6 0zM19 8l-3 7a3.5 3.5 0 0 0 6 0z"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    pausebig: '<path d="M9 5v14M15 5v14"/>'
  };
  QI.icon = function (name) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'ico');
    s.setAttribute('fill', 'none');
    s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '2');
    s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round');
    s.setAttribute('aria-hidden', 'true');
    s.setAttribute('focusable', 'false');
    s.innerHTML = ICONS[name] || '';
    return s;
  };

  QI.svg = function (markup) {
    const t = document.createElement('template');
    t.innerHTML = markup.trim();
    return t.content.firstChild;
  };

  QI.norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ ]/g, ' ').replace(/\s+/g, ' ').trim();
  QI.fmtNum = (n, d = 0) => Number(n).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
  QI.stripHtml = (s) => String(s).replace(/\{\{[^|]+\|([^}]+)\}\}/g, '$1').replace(/<[^>]+>/g, '');

  /* Convierte {{id|texto}} en botones de glosario. */
  QI.terms = function (str) {
    return String(str).replace(/\{\{([^|}]+)\|([^}]+)\}\}/g, (m, id, t) => '<button type="button" class="term" data-term="' + id + '" aria-haspopup="dialog">' + t + '</button>');
  };

  QI.toast = function (msg) {
    const box = document.getElementById('toasts');
    if (!box) return;
    const t = QI.h('div', { class: 'toast', role: 'status' }, msg);
    box.append(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => t.remove(), 4200);
  };

  const cache = {};
  QI.videoItem = function (v, rerender) {
    const h = QI.h;
    if (!v.youtubeId) return h('li', {}, h('span', {}, v.titulo), h('span', { class: 'badge soon' }, 'Próximamente'));
    const seen = QI.store.watchedVideo(v.id);
    const cita = v.canal + '. (s. f.). ' + v.tituloOriginal + ' [Video]. YouTube. ' + v.url;
    return h('li', { class: 'vitem' },
      h('div', { class: 'stack', style: 'gap:.35rem;flex:1;min-width:14rem' },
        h('b', {}, v.titulo),
        h('small', { class: 'muted' }, 'Canal: ' + v.canal),
        h('small', { class: 'cita' }, h('span', { class: 'sr-only' }, 'Cita: '), cita + ' (consultado el 23/10/2026)')),
      h('div', { class: 'row' },
        h('a', { class: 'btn small', href: v.url, target: '_blank', rel: 'noopener noreferrer' }, 'Ver en YouTube', h('span', { class: 'sr-only' }, ' (abre una pestaña nueva)')),
        h('button', { class: 'btn small ' + (seen ? 'ghost' : ''), type: 'button', 'aria-pressed': String(seen), onclick: () => { if (QI.store.markVideo(v.id)) { QI.toast('Video marcado como visto: +5 puntos'); } if (rerender) rerender(); } }, seen ? 'Visto ✓' : 'Ya lo vi')));
  };
  QI.data = function (name) {
    if (!cache[name] && window.QI_INLINE && window.QI_INLINE[name]) { cache[name] = Promise.resolve(window.QI_INLINE[name]); }
    if (!cache[name]) {
      cache[name] = fetch('data/' + name + '.json').then((r) => {
        if (!r.ok) throw new Error('No se pudo cargar ' + name);
        return r.json();
      });
    }
    return cache[name];
  };
})();
</script>
<script>/* Perfiles, progreso, puntos y medallas. Todo se guarda en localStorage del navegador. */
(function () {
  const KEY = 'qi.v1';
  const REQUIRED = ['teoria', 'simulacion', 'ejercicios', 'juego', 'autoevaluacion'];
  const COLORS = ['#1c58b8', '#0f766e', '#b4531c', '#7c3aed', '#be185d', '#4d6b12'];

  QI.DEFAULT_PREFS = {
    fs: 1, font: 'standard', spacing: 'normal', theme: 'auto', customOn: false, bg: '#ffffff', fg: '#12263f',
    tts: false, rate: 1, voice: '', hover: false, click: false, volume: 1,
    simple: false, steps: false, timer: false, breaks: 0, focus: false, highlight: false,
    anim: 'full', trans: 'smooth', autoDark: false, icons: 'normal'
  };

  QI.MEDALS = [
    { id: 'principiante', nombre: 'Principiante', desc: 'Completá un módulo.', icon: 'book', test: (s) => s.modsDone >= 1 },
    { id: 'explorador', nombre: 'Explorador', desc: 'Completá tres módulos.', icon: 'flask', test: (s) => s.modsDone >= 3 },
    { id: 'quimico', nombre: 'Químico', desc: 'Completá siete módulos.', icon: 'atom', test: (s) => s.modsDone >= 7 },
    { id: 'maestro', nombre: 'Maestro', desc: 'Completá los once módulos.', icon: 'trophy', test: (s) => s.modsDone >= 11 },
    { id: 'racha', nombre: 'Racha', desc: 'Estudiá tres días seguidos.', icon: 'flame', test: (s) => s.streak >= 3 },
    { id: 'rachamayor', nombre: 'Racha Mayor', desc: 'Estudiá siete días seguidos.', icon: 'flame', test: (s) => s.streak >= 7 },
    { id: 'precision', nombre: 'Precisión', desc: 'Sacá 100 % en una autoevaluación.', icon: 'check', test: (s) => s.quizBest >= 100 },
    { id: 'rompecabezas', nombre: 'Rompecabezas', desc: 'Resolvé cinco crucigramas.', icon: 'puzzle', test: (s) => s.crosswords >= 5 },
    { id: 'jugador', nombre: 'Jugador', desc: 'Ganá diez juegos distintos.', icon: 'game', test: (s) => s.gamesWon >= 10 },
    { id: 'oyente', nombre: 'Oyente', desc: 'Escuchá diez audios.', icon: 'audio', test: (s) => s.audios >= 10 },
    { id: 'cinefilo', nombre: 'Cinéfilo', desc: 'Marcá cinco videos como vistos.', icon: 'video', test: (s) => s.videos >= 5 }
  ];

  let memory = null;
  let persisted = true;
  function read() {
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { persisted = false; return null; }
  }
  function write() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { persisted = false; }
  }
  const uid = () => 'p' + Date.now().toString(36) + Math.floor(Math.random() * 999);
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function newProfile(nombre, color) {
    return { id: uid(), nombre, color: color || COLORS[0], prefs: Object.assign({}, QI.DEFAULT_PREFS), prog: { mods: {}, points: 0, minutes: 0, days: [], audios: 0, videos: 0, crosswords: 0, quizBest: 0, medals: {}, last: null } };
  }
  let st = read();
  if (!st || !st.profiles || !Object.keys(st.profiles).length) {
    const p = newProfile('Estudiante');
    st = { active: p.id, profiles: { [p.id]: p } };
  }
  if (!st.profiles[st.active]) st.active = Object.keys(st.profiles)[0];

  const S = (QI.store = {
    COLORS, REQUIRED,
    persisted: () => persisted,
    all: () => Object.values(st.profiles),
    profile: () => st.profiles[st.active],
    prefs: () => S.profile().prefs,
    prog: () => S.profile().prog,
    save() { write(); },
    setPref(patch) { Object.assign(S.prefs(), patch); write(); QI.emit('prefs'); },
    resetPrefs() { S.profile().prefs = Object.assign({}, QI.DEFAULT_PREFS); write(); QI.emit('prefs'); },
    switchProfile(id) { if (st.profiles[id]) { st.active = id; write(); S.touchDay(); QI.emit('profile'); QI.emit('prefs'); QI.emit('progress'); } },
    createProfile(nombre, color) { const p = newProfile(nombre.trim() || 'Estudiante', color); st.profiles[p.id] = p; st.active = p.id; write(); S.touchDay(); QI.emit('profile'); QI.emit('prefs'); QI.emit('progress'); return p; },
    renameProfile(id, nombre) { if (st.profiles[id]) { st.profiles[id].nombre = nombre.trim() || st.profiles[id].nombre; write(); QI.emit('profile'); } },
    deleteProfile(id) {
      if (Object.keys(st.profiles).length < 2) return false;
      delete st.profiles[id];
      if (st.active === id) st.active = Object.keys(st.profiles)[0];
      write(); QI.emit('profile'); QI.emit('prefs'); QI.emit('progress'); return true;
    },
    exportPrefs() { return JSON.stringify({ qiPrefs: 1, prefs: S.prefs() }, null, 2); },
    importPrefs(text) {
      const o = JSON.parse(text);
      if (!o || !o.prefs || typeof o.prefs !== 'object') throw new Error('formato');
      const clean = {};
      for (const k of Object.keys(QI.DEFAULT_PREFS)) if (k in o.prefs && typeof o.prefs[k] === typeof QI.DEFAULT_PREFS[k]) clean[k] = o.prefs[k];
      S.setPref(clean);
    },

    touchDay() {
      const p = S.prog(), t = today();
      if (!p.days.includes(t)) { p.days.push(t); p.days.sort(); write(); S.checkMedals(); }
    },
    addMinutes(m) { S.prog().minutes += m; write(); },
    addPoints(n) { S.prog().points += n; write(); QI.emit('progress'); },
    setLast(hash, label) { S.prog().last = { hash, label }; write(); },
    awardGame(key, pts, pct) { const p = S.prog(); p.won = p.won || {}; const first = !(key in p.won); p.won[key] = Math.max(p.won[key] || 0, pct || 0); if (first) p.points = (p.points || 0) + pts; write(); S.checkMedals(); QI.emit('progress'); return first; },
    gameWon(prefix) { return Object.keys(S.prog().won || {}).some((k) => k.startsWith(prefix)); },
    watchedVideo(id) { return (S.prog().vistos || []).includes(id); },
    markVideo(id) { const p = S.prog(); p.vistos = p.vistos || []; if (p.vistos.includes(id)) return false; p.vistos.push(id); p.videos = p.vistos.length; p.points = (p.points || 0) + 5; write(); S.checkMedals(); QI.emit('progress'); return true; },
    count(key) { S.prog()[key] = (S.prog()[key] || 0) + 1; write(); S.checkMedals(); QI.emit('progress'); },
    quiz(pct) { const p = S.prog(); if (pct > p.quizBest) { p.quizBest = pct; write(); } S.checkMedals(); },

    mod(id) { const m = S.prog().mods; if (!m[id]) m[id] = { sections: {}, nota: null }; return m[id]; },
    isDone(id, sec) { return !!(S.prog().mods[id] && S.prog().mods[id].sections[sec]); },
    modulePct(id) { return Math.round((REQUIRED.filter((s) => S.isDone(id, s)).length / REQUIRED.length) * 100); },
    moduleComplete(id) { return REQUIRED.every((s) => S.isDone(id, s)); },
    modsDone() { return Object.keys(S.prog().mods).filter((id) => S.moduleComplete(id)).length; },
    overallPct(total = 11) { let sum = 0; for (let i = 1; i <= total; i++) sum += S.modulePct(i); return Math.round(sum / total); },
    markSection(id, sec) {
      if (S.isDone(id, sec)) return false;
      S.mod(id).sections[sec] = true;
      S.prog().points += 20;
      QI.toast('Sección completada: +20 puntos');
      if (S.moduleComplete(id)) { S.prog().points += 50; QI.toast('¡Módulo ' + id + ' completo! +50 puntos'); QI.emit('celebrate'); }
      write(); S.checkMedals(); QI.emit('progress');
      return true;
    },
    streak() {
      const days = S.prog().days.slice().sort();
      let best = 0, run = 0, prev = null;
      for (const d of days) {
        const cur = new Date(d + 'T12:00:00');
        run = prev && Math.round((cur - prev) / 86400000) === 1 ? run + 1 : 1;
        best = Math.max(best, run); prev = cur;
      }
      return best;
    },
    stats() { const p = S.prog(); return { modsDone: S.modsDone(), streak: S.streak(), quizBest: p.quizBest, crosswords: p.crosswords, audios: p.audios, videos: p.videos, gamesWon: Object.keys(p.won || {}).length }; },
    checkMedals() {
      const s = S.stats(), p = S.prog();
      for (const m of QI.MEDALS) {
        if (!p.medals[m.id] && m.test(s)) { p.medals[m.id] = today(); QI.toast('Nueva medalla: ' + m.nombre); QI.emit('celebrate'); }
      }
      write();
    }
  });
  S.touchDay();
})();
</script>
<script>/* Panel de accesibilidad: aplica preferencias, lectura por voz, temporizador y pausas. */
(function () {
  const h = QI.h;
  const root = document.documentElement;
  const reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  /* ---------- Aplicar preferencias ---------- */
  function setAttr(name, on, val) { if (on) root.setAttribute(name, val || 'on'); else root.removeAttribute(name); }
  function lum(hex) {
    const c = hex.replace('#', '').match(/.{2}/g).map((x) => parseInt(x, 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };

  function apply() {
    const p = QI.store.prefs();
    root.style.setProperty('--fs-scale', p.fs);
    root.setAttribute('data-font', p.font);
    setAttr('data-spacing', p.spacing !== 'normal', p.spacing);
    let theme = p.theme;
    if (p.autoDark) { const hr = new Date().getHours(); theme = hr >= 19 || hr < 7 ? 'dark' : 'light'; }
    setAttr('data-pref', theme !== 'auto', theme);
    const custom = ['--bg', '--surface', '--surface-2', '--fg', '--muted'];
    if (p.customOn) {
      root.style.setProperty('--bg', p.bg); root.style.setProperty('--surface', p.bg);
      root.style.setProperty('--surface-2', 'color-mix(in srgb, ' + p.bg + ' 90%, ' + p.fg + ')');
      root.style.setProperty('--fg', p.fg); root.style.setProperty('--muted', p.fg);
    } else custom.forEach((k) => root.style.removeProperty(k));
    setAttr('data-simple', p.simple); setAttr('data-steps', p.steps); setAttr('data-focus', p.focus); setAttr('data-highlight', p.highlight);
    root.setAttribute('data-anim', p.anim === 'full' && reduceMQ.matches ? 'reduced' : p.anim);
    root.setAttribute('data-trans', p.trans === 'smooth' ? 'smooth' : 'instant');
    setAttr('data-icons', p.icons !== 'normal', p.icons);
    const t = document.getElementById('timer'); if (t) t.hidden = !p.timer;
    breakAt = Date.now();
  }

  /* ---------- Lectura por voz ---------- */
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  let voices = [];
  function loadVoices() { if (synth) voices = synth.getVoices(); }
  if (synth) { loadVoices(); synth.addEventListener && synth.addEventListener('voiceschanged', loadVoices); }
  QI.tts = {
    supported: !!synth,
    voices: () => { const es = voices.filter((v) => /^es/i.test(v.lang)); return es.length ? es : voices; },
    speak(text, cb) {
      if (!synth) { QI.toast('Este navegador no ofrece lectura por voz.'); return false; }
      synth.cancel();
      const p = QI.store.prefs();
      const u = new SpeechSynthesisUtterance(QI.stripHtml(text));
      u.lang = 'es-AR'; u.rate = p.rate; u.volume = p.volume;
      const v = voices.find((x) => x.name === p.voice) || QI.tts.voices()[0];
      if (v) { u.voice = v; u.lang = v.lang; }
      if (cb && cb.onstart) u.onstart = cb.onstart;
      if (cb && cb.onend) u.onend = cb.onend;
      synth.speak(u);
      return true;
    },
    pause() { synth && synth.pause(); },
    resume() { synth && synth.resume(); },
    stop() { synth && synth.cancel(); }
  };
  let hoverT = null;
  const READABLE = 'p, li, h1, h2, h3, h4, button, label, dt, dd, summary, .opt';
  function readable(e) { const el = e.target.closest ? e.target.closest(READABLE) : null; if (!el) return null; const t = (el.getAttribute('aria-label') || el.textContent || '').trim(); return t && t.length < 500 ? t : null; }
  document.addEventListener('mouseover', (e) => {
    const p = QI.store.prefs(); if (!p.tts || !p.hover) return;
    const t = readable(e); if (!t) return;
    clearTimeout(hoverT); hoverT = setTimeout(() => QI.tts.speak(t), 450);
  });
  document.addEventListener('mouseout', () => clearTimeout(hoverT));
  document.addEventListener('click', (e) => { const p = QI.store.prefs(); if (!p.tts || !p.click) return; const t = readable(e); if (t) QI.tts.speak(t); });

  /* ---------- Temporizador, pausas y minutos de estudio ---------- */
  let started = Date.now(), pausedAt = 0, pausedTotal = 0, breakAt = Date.now(), paused = false, lastMin = Date.now();
  function fmt(ms) { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function setPaused(v) {
    paused = v;
    const scr = document.getElementById('pause'); if (scr) scr.hidden = !v;
    if (v) { pausedAt = Date.now(); QI.tts.stop(); const b = scr && scr.querySelector('button'); b && b.focus(); }
    else { pausedTotal += Date.now() - pausedAt; breakAt = Date.now(); lastMin = Date.now(); }
  }
  QI.pause = { toggle: () => setPaused(!paused), isPaused: () => paused };
  setInterval(() => {
    if (paused) return;
    const p = QI.store.prefs();
    const t = document.getElementById('timer');
    if (t && p.timer) t.textContent = fmt(Date.now() - started - pausedTotal);
    if (document.visibilityState === 'visible' && Date.now() - lastMin >= 30000) { lastMin = Date.now(); QI.store.addMinutes(0.5); }
    if (p.breaks > 0 && Date.now() - breakAt >= p.breaks * 60000) {
      breakAt = Date.now();
      QI.pause.toggle();
      const m = document.getElementById('pause-msg'); if (m) m.textContent = 'Llevás ' + p.breaks + ' minutos de estudio. Tomate un descanso y volvé cuando quieras.';
    }
  }, 1000);

  /* ---------- Controles del panel ---------- */
  let uidn = 0;
  function seg(legend, name, options, current, onchange) {
    const g = ++uidn;
    return h('fieldset', { class: 'field', style: 'border:0;padding:0;margin:0;min-width:0' },
      h('legend', { class: 'lbl', style: 'padding:0;margin-bottom:.4rem' }, legend),
      h('div', { class: 'seg' }, options.map(([val, text]) => h('label', {},
        h('input', { type: 'radio', name: name + g, value: val, checked: String(current) === String(val), onchange: () => onchange(val) }),
        h('span', {}, text)))));
  }
  function sw(text, checked, onchange, hint) {
    const id = 'sw' + (++uidn);
    return h('label', { class: 'switch', for: id }, h('span', {}, text, hint ? h('small', { class: 'muted', style: 'display:block;font-weight:400' }, hint) : null),
      h('input', { type: 'checkbox', role: 'switch', id, checked, onchange: (e) => onchange(e.target.checked) }));
  }
  function group(title, icon, children, open) {
    return h('details', { open }, h('summary', {}, QI.icon(icon), title), h('div', { class: 'opt-group' }, children));
  }

  let panel, opener;
  function render() {
    const p = QI.store.prefs(), set = (o) => QI.store.setPref(o);
    const body = panel.querySelector('.body'); body.innerHTML = '';
    const ratioOut = h('p', { class: 'muted', 'aria-live': 'polite' });
    const upd = () => { const r = ratio(QI.store.prefs().bg, QI.store.prefs().fg); ratioOut.textContent = 'Contraste actual: ' + QI.fmtNum(r, 1) + ' a 1. ' + (r >= 4.5 ? 'Cumple el mínimo de 4,5 a 1.' : 'Está por debajo del mínimo recomendado de 4,5 a 1.'); ratioOut.style.color = r >= 4.5 ? 'var(--ok)' : 'var(--err)'; };
    upd();
    const voiceSel = h('select', { id: 'voice-sel', 'aria-label': 'Voz', onchange: (e) => set({ voice: e.target.value }) }, h('option', { value: '' }, 'Predeterminada'));
    const fillVoices = () => { voiceSel.length = 1; QI.tts.voices().forEach((v) => voiceSel.append(h('option', { value: v.name, selected: v.name === p.voice }, v.name + ' (' + v.lang + ')'))); };
    fillVoices(); if (synth) setTimeout(fillVoices, 600);

    const exportBox = h('textarea', { id: 'exp', rows: 4, readonly: true, 'aria-label': 'Configuración exportada' }); exportBox.value = QI.store.exportPrefs();
    const importBox = h('textarea', { id: 'imp', rows: 3, placeholder: 'Pegá acá la configuración exportada', 'aria-label': 'Configuración a importar' });
    const msg = h('p', { 'aria-live': 'polite', class: 'muted' });
    const doImport = (text) => { try { QI.store.importPrefs(text); render(); msg.textContent = 'Configuración importada.'; } catch (e) { msg.textContent = 'No se pudo importar. Revisá que sea una configuración exportada desde esta página.'; } };

    body.append(
      group('Visión', 'access', [
        seg('Tamaño de letra', 'fs', [[0.9, 'A-'], [1, 'A'], [1.2, 'A+'], [1.45, 'A++']], p.fs, (v) => set({ fs: Number(v) })),
        seg('Tipografía', 'font', [['standard', 'Estándar'], ['opendyslexic', 'OpenDyslexic'], ['lexend', 'Lexend'], ['sans', 'Sans-serif'], ['serif', 'Serif']], p.font, (v) => set({ font: v })),
        seg('Espaciado entre letras y líneas', 'sp', [['normal', 'Normal'], ['wide', 'Amplio'], ['wider', 'Muy amplio']], p.spacing, (v) => set({ spacing: v })),
        seg('Contraste', 'th', [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Oscuro'], ['high', 'Alto contraste'], ['cream', 'Fondo crema']], p.theme, (v) => set({ theme: v })),
        h('div', { class: 'field' },
          sw('Colores personalizados', p.customOn, (v) => { set({ customOn: v }); upd(); }),
          h('div', { class: 'colors' },
            h('label', { class: 'field' }, h('span', { class: 'lbl' }, 'Fondo'), h('input', { type: 'color', value: p.bg, oninput: (e) => { set({ bg: e.target.value }); upd(); } })),
            h('label', { class: 'field' }, h('span', { class: 'lbl' }, 'Texto'), h('input', { type: 'color', value: p.fg, oninput: (e) => { set({ fg: e.target.value }); upd(); } }))),
          ratioOut)
      ], true),
      group('Audio', 'audio', [
        QI.tts.supported ? null : h('p', { class: 'nota' }, 'Este navegador no ofrece lectura por voz. El resto de las opciones sigue funcionando.'),
        sw('Lectura por voz', p.tts, (v) => { set({ tts: v }); if (!v) QI.tts.stop(); }, 'Activa la lectura al pasar el mouse o al hacer clic.'),
        seg('Velocidad', 'rate', [[0.5, '0,5x'], [0.75, '0,75x'], [1, '1x'], [1.25, '1,25x'], [1.5, '1,5x']], p.rate, (v) => set({ rate: Number(v) })),

        sw('Modo enfoque', p.focus, (v) => set({ focus: v }), 'Atenúa lo que no estás tocando.'),
        sw('Resaltar texto importante', p.highlight, (v) => set({ highlight: v }))
      ]),
      group('Visual', 'clock', [

        msg
      ])
    );
  }

  function open(btn) { opener = btn || document.activeElement; render(); panel.hidden = false; panel.querySelector('.close').focus(); document.getElementById('btn-a11y').setAttribute('aria-expanded', 'true'); }
  function close() { panel.hidden = true; document.getElementById('btn-a11y').setAttribute('aria-expanded', 'false'); opener && opener.focus && opener.focus(); }

  QI.a11y = {
    init() {
      panel = document.getElementById('a11y-panel');
      panel.innerHTML = '';
      panel.append(
        h('header', {}, h('h2', { id: 'a11y-title' }, 'Accesibilidad'), h('button', { class: 'btn iconbtn close', type: 'button', 'aria-label': 'Cerrar panel de accesibilidad', onclick: close }, QI.icon('close'))),
        h('div', { class: 'body' }),
        h('footer', {}, h('button', { class: 'btn', type: 'button', onclick: () => { QI.store.resetPrefs(); render(); } }, 'Restablecer todo'), h('button', { class: 'btn primary', type: 'button', onclick: close }, 'Listo'))
      );
      panel.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); close(); return; }
        if (e.key !== 'Tab') return;
        const f = [...panel.querySelectorAll('button, input, select, textarea, summary, a[href]')].filter((x) => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      });
      document.getElementById('btn-a11y').addEventListener('click', (e) => (panel.hidden ? open(e.currentTarget) : close()));
      QI.on('prefs', apply);
      reduceMQ.addEventListener && reduceMQ.addEventListener('change', apply);
      setInterval(() => { if (QI.store.prefs().autoDark) apply(); }, 600000);
      apply();
    },
    open, close, apply
  };
})();
</script>
<script>/* Ilustraciones propias: mascota Quimi, escenas de cada tema, insignias, confeti y fondo animado. */

  const TILE = { aprender: '#1c58b8', jugar: '#c2410c', videos: '#6d28d9', logros: '#a16207' };

  /* ---------- Decoración del encabezado de inicio y del fondo ---------- */
  function heroDecor() {
    return mk('<svg class="hero-deco deco" viewBox="0 0 600 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true" data-smil xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#fff" stroke-width="2" opacity=".35">' +
      '<path class="a-float" d="M60 40 l22 12 v24 l-22 12 l-22 -12 v-24 z"/><path class="a-float d2" d="M470 190 l30 17 v34 l-30 17 l-30 -17 v-34 z"/><path class="a-float d3" d="M330 30 l16 9 v18 l-16 9 l-16 -9 v-18 z"/>' +
      '<g transform="translate(520 70)"><ellipse rx="40" ry="14"/><ellipse rx="40" ry="14" transform="rotate(60)"/><ellipse rx="40" ry="14" transform="rotate(120)"/></g></g>' +
      '<g transform="translate(520 70)"><circle r="6" fill="#f7c948"/><circle r="4" fill="#fff"><animateMotion dur="4s" repeatCount="indefinite" path="M-40 0 a40 14 0 1 0 80 0 a40 14 0 1 0 -80 0"/></circle></g>' +
      '<g class="a-float d2" opacity=".5" fill="#fff"><circle cx="150" cy="210" r="9"/><circle cx="180" cy="228" r="6"/><circle cx="126" cy="230" r="6"/></g><g class="a-float" opacity=".5" fill="#f7c948"><circle cx="400" cy="120" r="5"/><circle cx="560" cy="200" r="4"/></g></svg>');
  }
  function bg() {
    if (document.getElementById('bgart')) return;
    const d = h('div', { id: 'bgart', class: 'bgart deco', 'aria-hidden': 'true' });
    [[4, 14, 70, 0], [88, 6, 54, 3], [93, 46, 96, 6], [2, 58, 110, 9], [46, 82, 64, 2], [76, 88, 80, 5], [22, 30, 40, 7]].forEach(([x, y, s, dl], i) => {
      d.append(h('span', { class: 'bgshape', style: 'left:' + x + '%;top:' + y + '%;width:' + s + 'px;height:' + s + 'px;animation-delay:-' + dl + 's' }, mk('<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">' + (i % 3 === 0 ? '<circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="4"/>' : '<path d="M50 4 90 27v46L50 96 10 73V27z" fill="none" stroke="currentColor" stroke-width="4"/>') + '</svg>')));
    });
    document.body.prepend(d);
  }

  /* ---------- Confeti ---------- */
  function confetti() {
    if (!animOn()) return;
    const cv = h('canvas', { class: 'confetti', 'aria-hidden': 'true' });
    cv.width = window.innerWidth; cv.height = window.innerHeight; document.body.append(cv);
    const ctx = cv.getContext('2d'), cols = ['#2f7ad6', '#14a39a', '#f08a24', '#f7c948', '#ec6a9a', '#8b5cf6', '#3fb56b'];
    const ps = Array.from({ length: 110 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.4, vx: Math.random() * 4 - 2, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: Math.random() * 0.3 - 0.15, c: cols[Math.floor(Math.random() * cols.length)] }));
    const t0 = performance.now();
    (function frame(t) {
      const k = (t - t0) / 2600;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, k - 0.6) / 0.4);
      ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (k < 1) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  QI.art = {
    mascot, scene: (name) => (SCENES[name] ? SCENES[name]() : null), astroPlace, moduleBadge, TILE, heroDecor, confetti, sync,
    init() { bg(); QI.on('celebrate', confetti); QI.on('prefs', sync); sync(); }
  };
})();
