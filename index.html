<script>/* Juegos. Fase 1: crucigrama con tres niveles de dificultad. */
(function () {
  const h = QI.h;

  QI.games = {
    CATALOGO: [
      { id: 'crucigrama', nombre: 'Crucigrama', icon: 'puzzle', desc: 'Completá palabras clave a partir de pistas.', modulos: 'Todos los módulos', disponible: true },
      { id: 'quiz', nombre: 'Quiz', icon: 'help', desc: 'Preguntas de opción múltiple con respuesta inmediata.', modulos: 'Todos los módulos', disponible: false },
      { id: 'memoria', nombre: 'Memoria', icon: 'atom', desc: 'Emparejá cada símbolo con su nombre.', modulos: 'Módulos 6 y 7', disponible: false },
      { id: 'arrastrar', nombre: 'Arrastrar y soltar', icon: 'flask', desc: 'Armá fórmulas químicas.', modulos: 'Módulos 9 y 10', disponible: false },
      { id: 'balancear', nombre: 'Balancear ecuaciones', icon: 'scale', desc: 'Ajustá los coeficientes de cada reacción.', modulos: 'Módulo 10', disponible: false },
      { id: 'clasificar', nombre: 'Clasificar sustancias', icon: 'book', desc: 'Llevá cada sustancia a su categoría.', modulos: 'Módulos 3, 4 y 9', disponible: false }
    ],

    async crossword(box, opts) {
      opts = opts || {};
      const mod = opts.mod || 1;
      const D = (await QI.data('juegos'))[mod].crucigrama;
      const LEVELS = [['facil', 'Fácil'], ['medio', 'Medio'], ['dificil', 'Difícil']];
      let level = opts.level || 'facil';
      const mount = h('div', { class: 'stack' });
      box.innerHTML = ''; box.append(mount);

      function build() {
        mount.innerHTML = '';
        const cells = new Map(); // "r,c" -> {r,c,ch,input,words:[],n}
        const key = (r, c) => r + ',' + c;
        D.words.forEach((w) => {
          for (let i = 0; i < w.answer.length; i++) {
            const r = w.r + (w.dir === 'v' ? i : 0), c = w.c + (w.dir === 'h' ? i : 0), k = key(r, c);
            if (!cells.has(k)) cells.set(k, { r, c, ch: w.answer[i], words: [], n: 0, input: null });
            cells.get(k).words.push({ w, i });
          }
          cells.get(key(w.r, w.c)).n = w.n;
        });
        let curWord = D.words[0], curCell = null, hints = 0, revealed = false, solved = false;
        const wordCells = (w) => w.answer.split('').map((_, i) => cells.get(key(w.r + (w.dir === 'v' ? i : 0), w.c + (w.dir === 'h' ? i : 0))));

        const status = h('div', { class: 'card', 'aria-live': 'polite', style: 'display:grid;gap:.25rem' });
        const banner = h('div', { 'aria-live': 'polite' });
        const grid = h('div', { class: 'cw', role: 'group', 'aria-label': 'Crucigrama de química, ' + D.rows + ' filas y ' + D.cols + ' columnas', style: 'grid-template-columns:repeat(' + D.cols + ',var(--cell))' });
        const clueBtns = new Map();

        for (let r = 0; r < D.rows; r++) for (let c = 0; c < D.cols; c++) {
          const cell = cells.get(key(r, c));
          if (!cell) { grid.append(h('div', { class: 'cw-cell void', 'aria-hidden': 'true' })); continue; }
          const names = cell.words.map((x) => x.w.n + ' ' + (x.w.dir === 'h' ? 'horizontal' : 'vertical')).join(' y ');
          const input = h('input', { type: 'text', maxlength: 2, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', tabindex: '-1', 'aria-label': 'Fila ' + (r + 1) + ', columna ' + (c + 1) + '. Palabra ' + names });
          cell.input = input;
          input.addEventListener('focus', () => select(cell, false));
          input.addEventListener('click', () => { if (curCell === cell && cell.words.length > 1) select(cell, true); });
          input.addEventListener('input', () => {
            const v = input.value.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z]/g, '');
            input.value = v.slice(-1);
            input.classList.remove('bad', 'good');
            if (input.value) step(cell, 1);
            after();
          });
          input.addEventListener('keydown', (e) => {
            const mv = { ArrowRight: [0, 1, 'h'], ArrowLeft: [0, -1, 'h'], ArrowDown: [1, 0, 'v'], ArrowUp: [-1, 0, 'v'] }[e.key];
            if (mv) { e.preventDefault(); const nx = cells.get(key(cell.r + mv[0], cell.c + mv[1])); if (nx) { const dirOk = nx.words.find((x) => x.w.dir === mv[2]); if (dirOk) curWord = dirOk.w; nx.input.focus(); } return; }
            if (e.key === 'Backspace') { e.preventDefault(); if (input.readOnly) { step(cell, -1); return; } if (input.value) { input.value = ''; input.classList.remove('bad', 'good'); after(); } else { step(cell, -1, true); } return; }
            if (e.key === 'Delete') { e.preventDefault(); if (!input.readOnly) { input.value = ''; after(); } }
          });
          cell.input = input;
          grid.append(h('div', { class: 'cw-cell' }, input, cell.n ? h('span', { class: 'n', 'aria-hidden': 'true' }, cell.n) : null));
        }

        function step(cell, d, clear) {
          const idx = cell.words.find((x) => x.w === curWord) || cell.words[0];
          const list = wordCells(idx.w), i = list.indexOf(cell) + d;
          if (i >= 0 && i < list.length) { curWord = idx.w; list[i].input.focus(); if (clear && !list[i].input.readOnly) { list[i].input.value = ''; list[i].input.classList.remove('bad', 'good'); after(); } }
        }
        function select(cell, toggle) {
          curCell = cell;
          const inDir = cell.words.find((x) => x.w === curWord);
          if (toggle || !inDir) { const other = cell.words.find((x) => x.w !== curWord); curWord = (other || cell.words[0]).w; }
          cells.forEach((cc) => { cc.input.tabIndex = cc === cell ? 0 : -1; cc.input.classList.remove('hl', 'cur'); });
          wordCells(curWord).forEach((cc) => cc.input.classList.add('hl'));
          cell.input.classList.add('cur'); cell.input.classList.remove('hl');
          status.innerHTML = '';
          status.append(h('b', {}, curWord.n + ' ' + (curWord.dir === 'h' ? 'Horizontal' : 'Vertical') + ' · ' + curWord.answer.length + ' letras'), h('span', {}, curWord.clue));
          clueBtns.forEach((b, w) => (w === curWord ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current')));
        }
        function wordOk(w) { return wordCells(w).every((cc) => cc.input.value === cc.ch); }
        function after() {
          D.words.forEach((w) => { const li = clueBtns.get(w).parentElement; li.classList.toggle('solved', wordOk(w)); });
          bankEls.forEach((el, w) => el.classList.toggle('used', wordOk(w)));
          const all = [...cells.values()].every((cc) => cc.input.value === cc.ch);
          if (all && !solved && !revealed) {
            solved = true;
            banner.innerHTML = '';
            const pts = { facil: 10, medio: 20, dificil: 30 }[level] + 20;
            const first = QI.store.awardGame('crucigrama-' + mod + '-' + level, pts, 100);
            banner.append(h('div', { class: 'feedback ok' }, QI.art.mascot('cheer', 56), h('div', {}, '¡Crucigrama completo! ' + (first ? 'Ganaste ' + pts + ' puntos.' : 'Ya habías ganado los puntos de este nivel.'), h('p', {}, hints ? 'Usaste ' + hints + (hints === 1 ? ' pista.' : ' pistas.') : 'Sin pistas.')))); QI.emit('celebrate');
            if (first) QI.store.count('crosswords');
            if (opts.onSolved) opts.onSolved(level);
          }
        }

        /* Pistas y banco de palabras */
        const clues = (dir, title) => h('div', {}, h('h3', {}, title), h('ol', {}, D.words.filter((w) => w.dir === dir).map((w) => {
          const b = h('button', { type: 'button', onclick: () => { curWord = w; wordCells(w)[0].input.focus(); select(wordCells(w)[0], false); } }, h('b', {}, w.n + '.'), h('span', {}, w.clue));
          clueBtns.set(w, b); return h('li', {}, b);
        })));
        const bankEls = new Map();
        const bank = level === 'facil' ? h('div', {}, h('h3', {}, 'Banco de palabras'), h('div', { class: 'wordbank', 'aria-label': 'Palabras para usar' }, [...D.words].map((w) => w.answer).sort().map((a) => { const el = h('span', {}, a); bankEls.set(D.words.find((w) => w.answer === a), el); return el; }))) : null;

        /* Ayudas por nivel */
        if (level !== 'dificil') D.words.forEach((w) => { const cc = wordCells(w)[0]; cc.input.value = cc.ch; cc.input.readOnly = true; cc.input.classList.add('hint'); });

        const msg = h('p', { 'aria-live': 'polite', class: 'muted' });
        let confirmReveal = false;
        const revealBtn = h('button', { class: 'btn', type: 'button' }, 'Ver soluciones');
        revealBtn.addEventListener('click', () => {
          if (!confirmReveal) { confirmReveal = true; revealBtn.textContent = 'Confirmar: ver soluciones'; msg.textContent = 'Si ves las soluciones, esta partida no suma puntos.'; return; }
          revealed = true; cells.forEach((cc) => { cc.input.value = cc.ch; cc.input.classList.remove('bad'); }); confirmReveal = false; revealBtn.textContent = 'Ver soluciones'; msg.textContent = 'Soluciones a la vista. Podés limpiar y volver a intentar.'; after();
        });
        const hintBtn = h('button', { class: 'btn', type: 'button', disabled: level === 'dificil', title: level === 'dificil' ? 'En nivel difícil no hay pistas' : null }, 'Pista');
        hintBtn.addEventListener('click', () => {
          const t = wordCells(curWord).find((cc) => cc.input.value !== cc.ch);
          if (!t) { msg.textContent = 'Esta palabra ya está completa.'; return; }
          t.input.value = t.ch; t.input.classList.remove('bad'); t.input.classList.add('good'); hints++; msg.textContent = 'Te mostré una letra.'; after();
        });
        const checkBtn = h('button', { class: 'btn primary', type: 'button' }, 'Comprobar');
        checkBtn.addEventListener('click', () => {
          let ok = 0, bad = 0, empty = 0;
          cells.forEach((cc) => { const v = cc.input.value; cc.input.classList.remove('bad', 'good'); if (!v) empty++; else if (v === cc.ch) { ok++; if (!cc.input.readOnly) cc.input.classList.add('good'); } else { bad++; cc.input.classList.add('bad'); } });
          msg.textContent = ok + ' letras bien, ' + bad + ' para revisar y ' + empty + ' vacías.';
        });
        const clearBtn = h('button', { class: 'btn', type: 'button' }, 'Limpiar');
        clearBtn.addEventListener('click', () => { build(); });

        mount.append(
          h('div', { class: 'row' }, h('span', { class: 'lbl', style: 'font-weight:700' }, 'Nivel:'),
            h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Nivel de dificultad' }, LEVELS.map(([v, t]) => h('label', {}, h('input', { type: 'radio', name: 'cwlevel', value: v, checked: v === level, onchange: () => { level = v; build(); } }), h('span', {}, t))))),
          h('p', { class: 'muted' }, level === 'facil' ? 'Con banco de palabras, primera letra y pistas.' : level === 'medio' ? 'Con primera letra y pistas, sin banco de palabras.' : 'Sin ayudas. Solo las definiciones.'),
          h('div', { class: 'how-to' }, h('b', {}, 'Cómo se juega'), h('ol', {}, h('li', {}, 'Tocá un casillero. Se marca la palabra y aparece su pista.'), h('li', {}, 'Escribí las letras sin tilde. El cursor avanza solo.'), h('li', {}, 'Tocá otra vez el mismo casillero para cambiar entre horizontal y vertical.'), h('li', {}, 'Cuando termines, tocá Comprobar.'))),

      h('div', { class: 'grid wide' }, cards),
      h('p', { class: 'muted' }, 'Juegos ganados: ' + Object.keys(QI.store.prog().won || {}).length + ' · Crucigramas resueltos: ' + QI.store.prog().crosswords));
  }
  async function juegoPage(v, tipo, mod) {
    const mods = await QI.data('modulos'), m = mods.find((x) => x.id === mod);
    const meta = QI.games.META[tipo], box = h('div', {});
    if (!m || !meta) { v.append(h('h1', {}, 'No encontramos ese juego'), h('a', { class: 'btn primary', href: '#jugar' }, 'Volver a los juegos')); return; }
    const otros = (await QI.games.forModule(mod)).filter((t) => t !== tipo);
    v.append(h('div', { class: 'crumbs' }, h('a', { class: 'btn small', href: '#jugar' }, QI.icon('left'), 'Volver a los juegos')),
      h('div', { class: 'card stack' }, h('div', { class: 'row', style: 'justify-content:space-between' }, h('h1', {}, meta.nombre + ': ' + m.titulo), h('span', { class: 'badge' }, 'Módulo ' + mod)), box),
      otros.length ? h('div', { class: 'card stack' }, h('h2', { style: 'font-size:1.05rem' }, 'Más juegos de este módulo'), h('div', { class: 'row' }, otros.map((t) => h('a', { class: 'btn small', href: '#jugar-' + t + '-' + mod }, QI.icon(QI.games.META[t].icon), QI.games.META[t].nombre)))) : null);
    QI.games.play(box, tipo, mod);
    QI.store.setLast('#jugar-' + tipo + '-' + mod, meta.nombre + ' · Módulo ' + mod);
  }
  const crucigrama = (v) => juegoPage(v, 'crucigrama', 1);

  async function videos(v) {
    const mods = await QI.data('modulos'), vids = await QI.data('videos');
    v.append(h('div', { class: 'stack' }, h('h1', {}, 'Videos'), h('p', { class: 'muted' }, vids.filter((x) => x.youtubeId).length + ' videos de otros autores, verificados, con su cita. Se abren en YouTube (nueva pestaña). Los marcados «Próximamente» todavía no tienen video elegido.')),
      ...mods.map((m) => { const l = vids.filter((x) => x.modulo === m.id); return l.length ? h('section', { class: 'card stack', 'aria-labelledby': 'vm' + m.id }, h('h2', { id: 'vm' + m.id }, 'Módulo ' + m.id + ': ' + m.titulo), h('ul', { class: 'vlist' }, l.map((x) => QI.videoItem(x, () => { v.innerHTML = ''; videos(v); })))) : null; }));
  }

  async function logros(v) {
    const mods = await QI.data('modulos'), p = QI.store.prog(), s = QI.store.stats();
    v.append(h('div', { class: 'hello' }, QI.art.mascot(Object.keys(p.medals).length ? 'cheer' : 'hi', 70), h('h1', {}, 'Mis Logros')),
      h('div', { class: 'stats' }, [['Puntos', p.points], ['Módulos completos', s.modsDone + ' / 11'], ['Mejor racha', s.streak + (s.streak === 1 ? ' día' : ' días')], ['Tiempo de estudio', Math.round(p.minutes) + ' min']].map(([k, val]) => h('div', { class: 'card stat' }, h('span', { class: 'muted' }, k), h('b', {}, String(val))))),
      h('section', { class: 'card stack', 'aria-labelledby': 'pm' }, h('h2', { id: 'pm' }, 'Progreso por módulo'), mods.map((m) => pbar(QI.store.modulePct(m.id), 'Módulo ' + m.id + ': ' + m.titulo))),
      h('section', { class: 'stack', 'aria-labelledby': 'md' }, h('h2', { id: 'md' }, 'Medallas (' + Object.keys(p.medals).length + ' de ' + QI.MEDALS.length + ')'),
        h('div', { class: 'grid' }, QI.MEDALS.map((m) => { const got = p.medals[m.id]; return h('div', { class: 'card medal ' + (got ? 'got' : 'locked') }, h('div', { class: 'disc' }, QI.icon(got ? m.icon : 'lock')), h('div', {}, h('h3', {}, m.nombre), h('p', { class: 'muted' }, m.desc), got ? h('span', { class: 'badge ok' }, 'Obtenida') : null)); }))));
  }

  async function ayuda(v) {
    const gl = await QI.data('glosario');
    const list = h('dl', { class: 'gloss' });
    const q = h('input', { type: 'search', id: 'gl-q', placeholder: 'Buscar un término', 'aria-label': 'Buscar en el glosario', oninput: () => draw() });
    const draw = () => { const n = QI.norm(q.value); list.innerHTML = ''; const f = gl.filter((g) => !n || QI.norm(g.termino).includes(n) || QI.norm(g.def).includes(n)); if (!f.length) list.append(h('p', {}, 'No hay términos que coincidan.')); f.forEach((g) => list.append(h('dt', {}, g.termino), h('dd', {}, g.def))); };
    const faq = [
      ['¿Cómo cambio el tamaño de la letra?', 'Tocá el botón Accesibilidad, abrí Visión y elegí A-, A, A+ o A++.'],
      ['¿Cómo hago para que lea en voz alta?', 'En la teoría de cada módulo elegí la versión Audio y tocá Escuchar. También podés activar la lectura por voz en Accesibilidad, sección Audio. Las voces dependen de tu dispositivo.'],
      ['¿Se guarda mi progreso?', 'Sí, en este navegador y por perfil. Si borrás los datos del navegador, se pierde.'],
      ['¿Podemos usar la misma computadora entre varios?', 'Sí. En Perfil creás un perfil por persona. Cada uno tiene su progreso y su configuración.'],
      ['El crucigrama me resulta difícil. ¿Qué hago?', 'Empezá en nivel fácil: tiene banco de palabras y primera letra. También podés usar el botón Pista.']
    ];
    v.append(h('div', { class: 'hello' }, QI.art.mascot('think', 70), h('h1', {}, 'Ayuda')),
      h('section', { class: 'stack faq', 'aria-labelledby': 'faq-t' }, h('h2', { id: 'faq-t' }, 'Preguntas frecuentes'), faq.map(([a, b]) => h('details', {}, h('summary', {}, a), h('p', {}, b)))),
      h('section', { class: 'card stack', 'aria-labelledby': 'gl-t' }, h('h2', { id: 'gl-t' }, 'Glosario del Módulo 1'), h('label', { for: 'gl-q', class: 'sr-only' }, 'Buscar un término'), q, list),
      h('div', { class: 'card stack' }, h('h2', {}, 'Asistente y contacto'), h('p', {}, 'El asistente de química y el formulario para escribirle a docentes o tutores todavía no están disponibles. Necesitan un servidor.'), h('button', { class: 'btn', type: 'button', onclick: assistant }, QI.icon('spark'), 'Sobre el asistente')));
    draw();
  }

  async function perfil(v) {
    const cur = QI.store.profile();
    let color = QI.store.COLORS[QI.store.all().length % QI.store.COLORS.length];
    const nameIn = h('input', { type: 'text', id: 'new-name', maxlength: 24, placeholder: 'Nombre' });
    const msg = h('p', { 'aria-live': 'polite', class: 'muted' });
    const confirm = {};
    const rows = h('div', { class: 'stack' });
    const draw = () => {
      rows.innerHTML = '';
      QI.store.all().forEach((x) => {
        const isCur = x.id === cur.id;
        const del = h('button', { class: 'btn small', type: 'button', disabled: QI.store.all().length < 2, onclick: () => { if (!confirm[x.id]) { confirm[x.id] = true; del.textContent = 'Confirmar: eliminar'; return; } QI.store.deleteProfile(x.id); } }, 'Eliminar');
        rows.append(h('div', { class: 'card profile-row' }, h('span', { class: 'avatar lg', style: 'background:' + x.color, 'aria-hidden': 'true' }, x.nombre.charAt(0).toUpperCase()),
          h('div', { class: 'grow' }, h('h3', {}, x.nombre), h('p', { class: 'muted' }, 'Progreso general: ' + pctFor(x) + ' %')),
          isCur ? h('span', { class: 'badge ok' }, 'En uso') : h('button', { class: 'btn small primary', type: 'button', onclick: () => QI.store.switchProfile(x.id) }, 'Usar'), del));
      });
    };
    function pctFor(x) { let sum = 0; for (let i = 1; i <= 11; i++) { const m = x.prog.mods[i]; sum += m ? Math.round((QI.store.REQUIRED.filter((s) => m.sections[s]).length / QI.store.REQUIRED.length) * 100) : 0; } return Math.round(sum / 11); }
    v.append(h('h1', {}, 'Perfil'), h('p', { class: 'muted' }, 'Cada perfil tiene su propio progreso, su configuración de accesibilidad y sus estadísticas.'), rows,
      h('form', { class: 'card stack', onsubmit: (e) => { e.preventDefault(); if (!nameIn.value.trim()) { msg.textContent = 'Escribí un nombre para crear el perfil.'; nameIn.focus(); return; } QI.store.createProfile(nameIn.value, color); } },
        h('h2', {}, 'Crear un perfil nuevo'), h('div', { class: 'field' }, h('label', { class: 'lbl', for: 'new-name' }, 'Nombre'), nameIn),
        h('fieldset', { class: 'field', style: 'border:0;padding:0;margin:0' }, h('legend', { class: 'lbl' }, 'Color del avatar'), h('div', { class: 'colorpick' }, QI.store.COLORS.map((c) => h('label', {}, h('input', { type: 'radio', name: 'col', value: c, checked: c === color, 'aria-label': 'Color ' + c, onchange: () => { color = c; } }), h('span', { style: 'background:' + c })))))
        , h('button', { class: 'btn primary', type: 'submit' }, 'Crear y usar'), msg));
    draw();
  }

  /* ---------- Router ---------- */
  const ROUTES = { inicio, aprender, jugar, 'jugar-crucigrama': crucigrama, videos, logros, ayuda, perfil };
  let rendering = 0;
  async function route(focus) {
    let r = (location.hash || '#inicio').slice(1) || 'inicio';
    if (r === 'main') { document.getElementById('main').focus(); return; }
    QI.tts.stop();
    const v = view(); const token = ++rendering;
    const holder = h('div', { class: 'view', id: 'view' });
    try {
      if (/^modulo-\d+$/.test(r)) { await QI.modules.render(holder, Number(r.split('-')[1])); }
      else if (/^jugar-[a-z]+-\d+$/.test(r)) { const [, t, n] = r.split('-'); await juegoPage(holder, t, Number(n)); }
      else if (ROUTES[r]) { await ROUTES[r](holder); }
      else { r = 'inicio'; await inicio(holder); }
    } catch (e) {
      holder.innerHTML = ''; holder.append(h('div', { class: 'card stack' }, h('h1', {}, 'No se pudo cargar esta sección'), h('p', {}, 'Revisá tu conexión y volvé a intentar.'), h('button', { class: 'btn primary', type: 'button', onclick: () => route(true) }, 'Reintentar')));
    }
    if (token !== rendering) return;
    v.replaceWith(holder);
    markNav(r);
    if (focus !== false) { window.scrollTo(0, 0); const t = holder.querySelector('h1'); if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } }
  }

  function init() {
    QI.a11y.init(); QI.art.init();
    const lg = document.querySelector('.logo'); if (lg) { lg.innerHTML = ''; lg.style.background = 'transparent'; lg.append(QI.art.mascot('hi', 34)); }
    drawNav(); drawChrome();
    document.getElementById('btn-pause').addEventListener('click', () => QI.pause.toggle());
    document.getElementById('btn-resume').addEventListener('click', () => QI.pause.toggle());
    document.querySelector('.skip').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('main').focus(); });
    window.addEventListener('hashchange', () => route(true));
    QI.on('profile', () => { drawChrome(); route(false); });
    route(true);
  }
  init();
})();
</script>
</body></html>
